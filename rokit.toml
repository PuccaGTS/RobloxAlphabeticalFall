# Менеджер инструментов Rokit: https://github.com/rojo-rbx/rokit
# Установка всех инструментов:  rokit install
# Если какая-то версия ниже не найдена — обнови её командой `rokit add <tool>`,
# она подставит актуальную. Если у тебя Aftman — те же строки работают в aftman.toml.

[tools]
rojo = "rojo-rbx/rojo@7.6.1"
wally = "UpliftGames/wally@0.3.2"
stylua = "JohnnyMorganz/StyLua@2.0.2"
selene = "Kampfkarren/selene@0.27.1"
luau-lsp = "JohnnyMorganz/luau-lsp@1.32.4"
run-in-roblox = "rojo-rbx/run-in-roblox@0.3.0"
